<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://discuss.eroscripts.com; style-src 'self' 'unsafe-inline' https://discuss.eroscripts.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://discuss.eroscripts.com; img-src 'self' https: data:; frame-src https://discuss.eroscripts.com; connect-src 'self' https://discuss.eroscripts.com">
  <title>Login - ScriptStash</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
    }
    .login-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .login-header {
      padding: 16px 24px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .login-header h1 {
      margin: 0;
      font-size: 18px;
      color: #e94560;
      font-weight: 600;
    }
    .login-header p {
      margin: 0;
      font-size: 14px;
      color: #a0a0a0;
    }
    .login-frame-container {
      flex: 1;
      position: relative;
    }
    .login-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    .login-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #a0a0a0;
    }
    .login-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <header class="login-header">
      <div>
        <h1>ScriptStash</h1>
        <p>Please log in to continue</p>
      </div>
    </header>
    <div class="login-frame-container">
      <div class="login-loading" id="loginLoading">
        <div class="spinner"></div>
        <p>Loading login page...</p>
      </div>
      <webview 
        id="loginFrame"
        src="https://discuss.eroscripts.com/login"
        class="login-frame"
        partition="persist:eroscripts"
        style="display: none;"
      ></webview>
    </div>
  </div>

  <script>
    const loginFrame = document.getElementById('loginFrame');
    const loginLoading = document.getElementById('loginLoading');
    
    loginFrame.addEventListener('dom-ready', () => {
      loginLoading.style.display = 'none';
      loginFrame.style.display = 'block';
    });

    loginFrame.addEventListener('did-navigate', (event) => {
      const url = event.url;
      // Check if we navigated away from login (successful login)
      if (url.includes('discuss.eroscripts.com') && !url.includes('/login')) {
        // Notify main process of successful login
        window.electronAPI.loginSuccess();
      }
    });

    // Listen for login complete event from main process
    window.electronAPI.onLoginComplete(() => {
      window.electronAPI.loginSuccess();
    });
  </script>
</body>
</html>
